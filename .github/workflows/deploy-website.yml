name: Deploy Spendot website

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This is the important part: the live demo on the website is
      # never hand-maintained. Every deploy overwrites website/demo/
      # with whatever is currently in apps/tauri/src — so editing the
      # real app and pushing is the only step needed to update the
      # website's live demo too.
      - name: Sync live demo from the real Tauri source
        run: |
          rm -rf website/demo
          mkdir -p website/demo
          cp apps/tauri/src/* website/demo/
          # Demo-only enhancement (never touches the real app source):
          # auto-opens the popover and reports content height to the
          # marketing page so the embed sizes itself like a real widget
          # instead of a fixed empty box.
          sed -i 's#</body>#<script src="../assets/demo-enhancements.js"></script>\n</body>#' website/demo/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
